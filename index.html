<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anton Paar &#x2192; Brewfather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1f3a30; --bone:#f2ede1; --bone-2:#e7dfce; --sage:#8ea885; --sage-2:#6f8c69;
    --ink:#17241e; --muted:#5f6f65; --ok:#3f7d4e; --warn:#b4603a; --line:rgba(23,36,30,.12);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;background:var(--bone);color:var(--ink);
    padding:max(16px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;-webkit-text-size-adjust:100%}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 16px}
  h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sub{font:500 12px/1 "JetBrains Mono",monospace;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .ctitle{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
  .ctitle b{font-size:15px} .ctitle .sn{font:500 11px/1 "JetBrains Mono",monospace;color:var(--muted)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
  select,button{font-family:inherit;font-size:16px;width:100%;border-radius:12px}
  select{padding:12px;border:1px solid var(--line);background:var(--bone);color:var(--ink);appearance:none}
  select:disabled{opacity:.5}
  button{border:0;padding:14px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--pine);color:var(--bone)} .btn-primary:disabled{background:var(--bone-2);color:var(--muted)}
  .btn-ghost{background:var(--bone);color:var(--ink);border:1px solid var(--line)}
  .conn{display:flex;gap:10px;margin-bottom:10px}
  .readout{display:flex;gap:12px;margin:0 0 4px}
  .metric{flex:1;background:var(--pine);color:var(--bone);border-radius:14px;padding:14px 12px;text-align:center}
  .metric .v{font:700 28px/1 "JetBrains Mono",monospace;letter-spacing:-.02em}
  .metric .k{font-size:11px;opacity:.75;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
  .metric.alt{background:var(--sage);color:var(--ink)}
  .raw{font:500 12px/1.4 "JetBrains Mono",monospace;color:var(--muted);text-align:center;margin-top:8px}
  .status{display:flex;align-items:center;gap:8px;font:500 13px/1.3 "JetBrains Mono",monospace;color:var(--muted);min-height:20px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .dot.on{background:var(--ok)} .dot.err{background:var(--warn)} .dot.busy{background:var(--sage-2)}
  .hint{font-size:13px;color:var(--muted);line-height:1.5}
  .mb8{margin-bottom:8px}
  details.logbox{margin-top:8px}
  details.logbox summary{font:500 12px/1 "JetBrains Mono",monospace;color:var(--muted);cursor:pointer;list-style:none;padding:6px 0}
  details.logbox summary::-webkit-details-marker{display:none}
  .log{font:500 12px/1.5 "JetBrains Mono",monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word;margin-top:6px;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
</style>
</head>
<body>
<header><h1>Anton Paar &#x2192; Brewfather</h1><span class="sub" id="hdr">meter + pH</span></header>

<div id="nobluetooth" class="card" style="display:none">
  <p class="hint"><b>Web Bluetooth niet beschikbaar.</b> Open deze pagina in de <b>Bluefy</b>-browser (App Store). Safari en Chrome op iOS ondersteunen geen BLE.</p>
</div>

<div class="card">
  <div class="conn">
    <button id="connectEd" class="btn-primary">Verbind EasyDens</button>
    <button id="connectPh" class="btn-primary">Verbind pH2Go</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="state">Niet verbonden</span></div>
</div>

<div class="card" id="batchCard" style="display:none">
  <label for="batch">Brewfather-batch (voor measured OG/FG)</label>
  <select id="batch"><option>Laden&#x2026;</option></select>
</div>

<div id="devices"></div>

<details class="logbox">
  <summary>Logboek</summary>
  <div class="log" id="log"></div>
</details>

<script>
function md5bytes(bytes){
  const rl=(x,c)=>(x<<c)|(x>>>(32-c)), add=(a,b)=>(a+b)|0;
  const s=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
           4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K=[];for(let i=0;i<64;i++)K[i]=(Math.floor(Math.abs(Math.sin(i+1))*4294967296))|0;
  const ml=bytes.length, padLen=(((ml+8)>>6)+1)<<6, msg=new Uint8Array(padLen);
  msg.set(bytes); msg[ml]=0x80; const bits=ml*8;
  msg[padLen-8]=bits&0xff;msg[padLen-7]=(bits>>>8)&0xff;msg[padLen-6]=(bits>>>16)&0xff;msg[padLen-5]=(bits>>>24)&0xff;
  let a0=0x67452301|0,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476|0; const M=new Int32Array(16);
  for(let o=0;o<padLen;o+=64){
    for(let i=0;i<16;i++)M[i]=msg[o+i*4]|(msg[o+i*4+1]<<8)|(msg[o+i*4+2]<<16)|(msg[o+i*4+3]<<24);
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){let F,g;
      if(i<16){F=(B&C)|((~B)&D);g=i;} else if(i<32){F=(D&B)|((~D)&C);g=(5*i+1)&15;}
      else if(i<48){F=B^C^D;g=(3*i+5)&15;} else{F=C^(B|(~D));g=(7*i)&15;}
      F=add(add(add(F,A),K[i]),M[g]); A=D;D=C;C=B;B=add(B,rl(F,s[i]));}
    a0=add(a0,A);b0=add(b0,B);c0=add(c0,C);d0=add(d0,D);
  }
  const out=new Uint8Array(16);
  [a0,b0,c0,d0].forEach((h,i)=>{out[i*4]=h&255;out[i*4+1]=(h>>>8)&255;out[i*4+2]=(h>>>16)&255;out[i*4+3]=(h>>>24)&255;});
  return out;
}

const ED={svc:"41500000-d278-11eb-b8bc-0242ac130003",dens:"41500001-d278-11eb-b8bc-0242ac130003",
  temp:"41500002-d278-11eb-b8bc-0242ac130003",cmd:"41500003-d278-11eb-b8bc-0242ac130003"};
const PH={svc:"09900000-0000-18a2-803d-e4a6eb999090",io:"0000fff1-0000-1000-8000-00805f9b34fb",
  nonce:"0000fff0-0000-1000-8000-00805f9b34fb"};
const DIS="0000180a-0000-1000-8000-00805f9b34fb";
const C_SERIAL="00002a25-0000-1000-8000-00805f9b34fb";
const C_SYSID ="00002a23-0000-1000-8000-00805f9b34fb";
const ZIV=new Uint8Array(16);
const $=id=>document.getElementById(id);

function logLine(s){const l=$("log");if(!l)return;l.textContent=(l.textContent?l.textContent+"\n":"")+s;l.scrollTop=l.scrollHeight;}
function setState(t,c){ $("state").textContent=t; $("dot").className="dot"+(c?" "+c:""); }
function rhoWater(T){const n=999.83952+16.945176*T-7.9870401e-3*T*T-46.170461e-6*T**3+105.56302e-9*T**4-280.54253e-12*T**5;return n/(1+16.879850e-3*T)/1000;}
const RHO20=rhoWater(20);
const toSG=(rho,T)=>(rho+(RHO20-rhoWater(T)))/RHO20;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function readStr(svcOrServer,uuid){
  const dis=await svcOrServer.getPrimaryService(DIS);
  const dv=await (await dis.getCharacteristic(uuid)).readValue();
  let s="";for(let i=0;i<dv.byteLength;i++){const b=dv.getUint8(i);if(b===0)break;s+=String.fromCharCode(b);} return s;
}
async function readBytes(server,uuid){
  const dis=await server.getPrimaryService(DIS);
  const dv=await (await dis.getCharacteristic(uuid)).readValue();
  return u8(dv).slice();
}
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,"0")).join("");
// Bytes van een DataView, met respect voor byteOffset/byteLength (sommige browsers geven een view op een grotere buffer).
const u8=v=>new Uint8Array(v.buffer,v.byteOffset,v.byteLength);

const devices=[];
let batchesLoaded=false;

async function tryKnown(kind){
  if(!navigator.bluetooth.getDevices) return null;
  let known; try{ known=await navigator.bluetooth.getDevices(); }catch(e){ return null; }
  const isPh=d=>/ph2go/i.test(d.name||"");
  const cands=known.filter(d=> kind==="ph"?isPh(d):!isPh(d));
  for(const d of cands){
    try{
      const server=await d.gatt.connect();
      const want=kind==="ph"?PH.svc:ED.svc;
      try{ const svc=await server.getPrimaryService(want); return {dev:d,server,svc,type:kind==="ph"?"ph2go":"easydens"}; }
      catch(e){ try{d.gatt.disconnect();}catch(_){} }
    }catch(e){}
  }
  return null;
}
async function connect(kind){
  try{
    if(devices.some(d=>d.alive && ((kind==="ed"&&d.type==="ed")||(kind==="ph"&&d.type==="ph")))){ setState("Al verbonden","on"); return; }
    setState("Verbinden\u2026","busy");
    let picked=await tryKnown(kind);
    if(!picked){
      setState("Zoeken\u2026","busy");
      const dev = kind==="ed"
        ? await navigator.bluetooth.requestDevice({filters:[{services:[ED.svc]}],optionalServices:[DIS,ED.svc,PH.svc]})
        : await navigator.bluetooth.requestDevice({filters:[{namePrefix:"pH2Go"}],optionalServices:[DIS,ED.svc,PH.svc]});
      setState("Verbinden\u2026","busy");
      const server=await dev.gatt.connect();
      let type=null,svc=null;
      try{ svc=await server.getPrimaryService(ED.svc); type="easydens"; }catch(e){}
      if(!type){ try{ svc=await server.getPrimaryService(PH.svc); type="ph2go"; }catch(e){} }
      if(!type){ setState("Onbekend apparaat","err"); return; }
      picked={dev,server,svc,type};
    }
    const {dev,server,svc,type}=picked;
    dev.addEventListener("gattserverdisconnected",()=>{ const d=devices.find(x=>x.dev===dev); if(d){d.alive=false;d.setStatus("Verbinding verbroken","err");} });
    if(type==="easydens") await setupED(dev,server,svc);
    else await setupPH(dev,server,svc);
    setState("Verbonden","on");
    $("batchCard").style.display="block";
    if(!batchesLoaded){ batchesLoaded=true; loadBatches(); }
  }catch(e){ setState("Fout: "+(e.message||e),"err"); }
}

function makeCard(title,sn){
  const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<div class="ctitle"><b>${title}</b><span class="sn">${sn}</span></div>
    <button class="btn-primary meet mb8">Meet</button>
    <div class="readout"><div class="metric"><div class="v v1">\u2014</div><div class="k k1"></div></div>
    <div class="metric alt"><div class="v v2">\u2014</div><div class="k">Temp \u00b0C</div></div></div>
    <div class="raw"></div>
    <div class="wrap" style="margin-top:14px"></div>
    <div class="status" style="margin-top:10px"><span class="dot d"></span><span class="st">Klaar</span></div>`;
  $("devices").appendChild(c);
  return c;
}
function cardStatus(c){ return (t,cls)=>{ c.querySelector(".st").textContent=t; c.querySelector(".d").className="dot d"+(cls?" "+cls:""); }; }

async function setupED(dev,server,svc){
  const sn=await readStr(server,C_SERIAL);
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(sn.repeat(4)),{name:"AES-CBC"},false,["encrypt","decrypt"]);
  const densC=await svc.getCharacteristic(ED.dens), tempC=await svc.getCharacteristic(ED.temp), cmdC=await svc.getCharacteristic(ED.cmd);
  const card=makeCard("EasyDens","SN "+sn);
  card.querySelector(".k1").textContent="SG (20 \u00b0C)";
  const D={type:"ed",dev,key,cmdC,alive:true,density:null,temp:null,measuring:false,samples:[],timer:null,card,
    setStatus:cardStatus(card),log:(s)=>logLine("EasyDens: "+s),target:"measuredFg"};
  devices.push(D);
  card.querySelector(".wrap").innerHTML=`<label>Schrijf SG naar</label>
    <select class="tgt" style="margin-bottom:12px">
      <option value="measuredFg" selected>Measured FG</option>
      <option value="measuredOg">Measured OG</option>
      <option value="measuredFirstWortGravity">First Wort Gravity</option>
      <option value="measuredPreBoilGravity">Pre-Boil Gravity</option>
      <option value="measuredPostBoilGravity">Post-Boil Gravity</option>
      <option value="stream">Grafiek (Custom Stream)</option>
    </select>
    <button class="btn-primary w" disabled>Schrijf naar Brewfather</button>`;
  card.querySelector(".tgt").addEventListener("change",()=>renderED(D));
  card.querySelector(".meet").addEventListener("click",()=>measureED(D));
  card.querySelector(".w").addEventListener("click",()=>writeED(D));
  async function dec(dv){const ct=u8(dv).slice(0,16);
    try{const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:ZIV},key,ct);const f=new DataView(pt).getFloat32(0,true);return Number.isNaN(f)?null:f;}catch(e){return null;}}
  await tempC.startNotifications();
  tempC.addEventListener("characteristicvaluechanged",async e=>{const v=await dec(e.target.value);if(v!=null){D.temp=v;renderED(D);}});
  await densC.startNotifications();
  densC.addEventListener("characteristicvaluechanged",async e=>{const v=await dec(e.target.value);if(v==null)return;
    D.density=v;renderED(D);
    if(D.measuring&&D.temp!=null){D.samples.push(toSG(v,D.temp));const last=D.samples.slice(-5);
      if(last.length>=5&&Math.max(...last)-Math.min(...last)<0.0003)finishED(D,"stable");}});
}
function renderED(D){const sg=(D.density!=null&&D.temp!=null)?toSG(D.density,D.temp):null;
  D.card.querySelector(".v1").textContent=sg!=null?sg.toFixed(4):"\u2014";
  D.card.querySelector(".v2").textContent=D.temp!=null?D.temp.toFixed(2):"\u2014";
  D.card.querySelector(".raw").textContent=D.density!=null?`ruwe dichtheid ${D.density.toFixed(5)} g/cm\u00b3`:"";
  const t=D.card.querySelector(".tgt")?.value;
  D.card.querySelector(".w").disabled=D.measuring||sg==null||(t!=="stream"&&!$("batch").value);}
async function sendED(D,arr){const ab=await crypto.subtle.encrypt({name:"AES-CBC",iv:ZIV},D.key,new Uint8Array(arr));
  const ct=new Uint8Array(ab),f=new Uint8Array(2+ct.length);f[0]=0x80;f[1]=ct.length;f.set(ct,2);await D.cmdC.writeValueWithResponse(f);}
async function measureED(D){if(D.measuring)return;D.measuring=true;D.samples=[];D.density=null;
  D.card.querySelector(".meet").disabled=true;D.card.querySelector(".meet").textContent="Meten\u2026";D.setStatus("Meten\u2026","busy");renderED(D);
  try{await sendED(D,[1,0]);}catch(e){D.measuring=false;D.card.querySelector(".meet").disabled=false;D.card.querySelector(".meet").textContent="Meet";D.setStatus("Startfout","err");return;}
  D.timer=setTimeout(()=>finishED(D,"timeout"),10000);}
async function finishED(D,reason){if(!D.measuring)return;D.measuring=false;clearTimeout(D.timer);
  try{await sendED(D,[2]);}catch(e){}
  D.card.querySelector(".meet").disabled=false;D.card.querySelector(".meet").textContent="Meet";
  const sg=(D.density!=null&&D.temp!=null)?toSG(D.density,D.temp):null;
  D.setStatus(sg!=null?(reason==="stable"?"Stabiel \u2713 SG "+sg.toFixed(4):"Gestopt (10 s) SG "+sg.toFixed(4)):"Geen meting",sg!=null?"on":"err");renderED(D);}
const FIELD_LABEL={measuredFg:"Measured FG",measuredOg:"Measured OG",measuredFirstWortGravity:"First Wort",measuredPreBoilGravity:"Pre-Boil",measuredPostBoilGravity:"Post-Boil",measuredMashPh:"Mash pH"};
async function writeED(D){const sg=toSG(D.density,D.temp),t=D.card.querySelector(".tgt").value;
  const body=t==="stream"?{sg,temp:D.temp,deviceName:"EasyDens",patch:false,stream:true}
    :{batchId:$("batch").value,sg,temp:D.temp,field:t,deviceName:"EasyDens",patch:true,stream:false};
  D.card.querySelector(".w").disabled=true;D.setStatus("Schrijven\u2026","busy");
  try{const r=await fetch("/api/write",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();const res=t==="stream"?d.results?.stream:d.results?.patch;const ok=!!res?.ok;
    D.log(`SG ${d.sg} \u2192 ${t==="stream"?"grafiek":(FIELD_LABEL[t]||t)}: ${ok?"ok":"FOUT "+(res?.status||res?.error||"")}`);
    D.setStatus(ok?"Weggeschreven \u2713":"Mislukt","on");}
  catch(e){D.log("Netwerkfout");D.setStatus("Fout","err");}}

async function setupPH(dev,server,svc){
  const sysB=await readBytes(server,C_SYSID), boardB=await readBytes(server,C_SERIAL);
  const board=await readStr(server,C_SERIAL);
  const xor=new Uint8Array(8); for(let i=0;i<8;i++) xor[i]=(sysB[i]||0)^(boardB[i]||0);
  const keyBytes=new Uint8Array([0x41,0x83,0xA3,...xor,0x50,0xD1,0x50,0x29,0x9D]);
  const key=await crypto.subtle.importKey("raw",keyBytes,{name:"AES-CBC"},false,["encrypt","decrypt"]);
  const io=await svc.getCharacteristic(PH.io);
  const nref=await svc.getCharacteristic(PH.nonce);
  const card=makeCard("pH2Go","SN "+board);
  card.querySelector(".k1").textContent="pH";
  const D={type:"ph",dev,key,iv:null,io,nref,alive:true,ph:null,temp:null,mv:null,cal:null,measuring:false,card,
    setStatus:cardStatus(card),log:(s)=>logLine("pH2Go: "+s),buf:new Uint8Array(0),waiter:null,q:null,toggle:true};
  devices.push(D);
  card.querySelector(".wrap").innerHTML=`<label>Schrijf pH naar</label>
    <select class="tgt" style="margin-bottom:12px">
      <option value="stream" selected>Grafiek (Custom Stream)</option>
      <option value="measuredMashPh">Mash pH (batch)</option>
    </select>
    <button class="btn-primary w" disabled>Schrijf naar Brewfather</button>`;
  card.querySelector(".tgt").addEventListener("change",()=>renderPH(D));
  card.querySelector(".meet").addEventListener("click",()=>measurePH(D));
  card.querySelector(".w").addEventListener("click",()=>writePH(D));
  card.querySelector(".meet").disabled=true;
  io.addEventListener("characteristicvaluechanged",e=>onPhChunk(D,e.target.value));
  await readIV(D);
  D.log("verbonden");
  // Handshake zoals de officiele app. De eerste led dient ook om een eventueel vervuilde meterbuffer leeg te maken.
  for(let a=1;a<=2;a++){
    try{const r=await reqPH(D,{op:"led"},2500,"led"); if(r.op!==false)break; D.log("led: meterfout e="+r.e);}
    catch(e){D.log("led: geen antwoord"); await readIV(D).catch(()=>{});}
  }
  await loadCal(D);
  D.card.querySelector(".meet").disabled=false;
  D.setStatus(D.cal?"Klaar":"Klaar (kalibratie niet gelezen)",D.cal?"":"err");
}

// ---- pH2Go-protocol: byte-exact gelijk aan de officiele Anton Paar-app (geverifieerd met PacketLogger-opnames) ----
// Opdracht = compacte JSON + afsluitende nul-byte, AES-CBC met PKCS7. Zonder de nul-byte leest de firmware door in oude buffer-data.
async function phEncrypt(key,iv,obj){
  const js=new TextEncoder().encode(JSON.stringify(obj)), pt=new Uint8Array(js.length+1); pt.set(js);
  return new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC",iv},key,pt));
}
// Antwoord = een CBC-stroom vanaf de vaste IV, in stukjes van 16 bytes. Er kunnen oude stukjes voor zitten: probeer elk 16-byte startpunt.
async function phDecode(key,iv,buf){
  for(let k=0;k+16<=buf.length;k+=16){
    try{const pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-CBC",iv},key,buf.slice(k)));
      let n=pt.indexOf(0); if(n<0)n=pt.length;
      const obj=JSON.parse(new TextDecoder().decode(pt.slice(0,n)));
      if(obj&&typeof obj==="object")return obj;
    }catch(e){}
  }
  return null;
}
// De nonce (en dus de IV) is vast per verbinding: de officiele app leest hem een keer.
async function readIV(D){ D.iv=md5bytes(u8(await D.nref.readValue()).slice(3,19)); }
async function onPhChunk(D,v){
  const w=D.waiter; if(!w)return; // niemand wacht op antwoord: late/oude stukjes weggooien
  const c=u8(v), nb=new Uint8Array(D.buf.length+c.length); nb.set(D.buf); nb.set(c,D.buf.length);
  D.buf=nb.length>2048?nb.slice(nb.length-2048):nb;
  if(D.buf.length%16)return;
  const obj=await phDecode(D.key,D.iv,D.buf);
  if(!obj||D.waiter!==w)return;
  if(obj.op===false||!w.expect||(w.expect in obj)){ D.waiter=null; D.buf=new Uint8Array(0); w.done(obj); }
  else D.buf=new Uint8Array(0); // antwoord op een eerdere opdracht: negeren
}
// Een opdracht tegelijk. Per opdracht: notificaties aan -> schrijven -> antwoord -> notificaties uit (zoals de officiele app).
function reqPH(D,obj,timeout,expect){
  const run=async()=>{
    if(D.toggle){
      try{ await D.io.startNotifications(); }
      catch(e){ D.toggle=false; D.log("notificaties blijvend aan ("+(e.message||e)+")"); try{await D.io.startNotifications();}catch(_){} }
    }
    D.buf=new Uint8Array(0);
    let w; const p=new Promise((res,rej)=>{
      const t=setTimeout(()=>{ if(D.waiter===w)D.waiter=null; rej(new Error("timeout")); },timeout||3000);
      w={expect,done:o=>{clearTimeout(t);res(o);}}; D.waiter=w;
    });
    p.catch(()=>{});
    try{
      const payload=await phEncrypt(D.key,D.iv,obj);
      try{ await D.io.writeValueWithResponse(payload); }
      catch(err){ await D.io.writeValueWithoutResponse(payload); }
      return await p;
    }finally{
      if(D.waiter===w)D.waiter=null;
      if(D.toggle){ try{ await D.io.stopNotifications(); }catch(e){} }
    }
  };
  const next=(D.q||Promise.resolve()).then(run,run);
  D.q=next.catch(()=>{});
  return next;
}
async function loadCal(D){
  for(let a=1;a<=3;a++){
    try{const c=await reqPH(D,{op:"rcalib"},4000,"calib");
      if(c.op===false) D.log("kalibratie: meterfout e="+c.e);
      else if(Array.isArray(c.calib)&&c.calib.length>=2){
        D.cal=c.calib.filter(x=>typeof x.ph==="number"&&typeof x.mv==="number").map(x=>({ph:x.ph,mv:x.mv})).sort((x,y)=>x.mv-y.mv);
        D.log("kalib"+(c.bufferset?" ("+c.bufferset+")":"")+": "+D.cal.map(x=>"pH "+x.ph+" @ "+x.mv.toFixed(1)+" mV").join(" / "));
        return true;
      } else D.log("kalibratie: onbekend formaat");
    }catch(e){ D.log("kalibratie: geen antwoord (poging "+a+")"); await readIV(D).catch(()=>{}); }
    await sleep(300);
  }
  D.log("kalibratie niet gelezen");
  return false;
}
// pH uit mV: lineair tussen de twee kalibratiepunten rond de meting (meerpunts-kalibratie werkt ook).
function phFrom(D,mv){
  const c=D.cal; if(!c||c.length<2||mv==null)return null;
  let i=0; while(i<c.length-2&&mv>c[i+1].mv)i++;
  const a=c[i],b=c[i+1]; return a.ph+(mv-a.mv)*(b.ph-a.ph)/(b.mv-a.mv);
}
function renderPH(D){D.card.querySelector(".v1").textContent=D.ph!=null?D.ph.toFixed(2):"\u2014";
  D.card.querySelector(".v2").textContent=D.temp!=null?D.temp.toFixed(2):"\u2014";
  D.card.querySelector(".raw").textContent=D.mv!=null?`${D.mv.toFixed(1)} mV`:"";
  const t=D.card.querySelector(".tgt")?.value;
  D.card.querySelector(".w").disabled=D.measuring||D.ph==null||(t!=="stream"&&!$("batch").value);}
async function measurePH(D){if(D.measuring)return;D.measuring=true;
  const btn=D.card.querySelector(".meet");btn.disabled=true;btn.textContent="Meten\u2026";D.setStatus("Meten\u2026","busy");
  D.ph=null;renderPH(D);
  if(!D.cal){ D.log("kalibratie opnieuw lezen"); await loadCal(D); }
  const samples=[],t0=Date.now();let got=0,stable=false,lastErr=null;
  while(Date.now()-t0<20000){
    let r;
    try{r=await reqPH(D,{op:"meas"},4000,"mv");}
    catch(e){D.log("meting: geen antwoord, opnieuw");await readIV(D).catch(()=>{});continue;}
    if(r.op===false){lastErr=r.e;D.log("meting: meterfout e="+r.e+", opnieuw");await sleep(800);continue;}
    got++;if(got===1)D.log("meting: "+JSON.stringify(r).slice(0,120));
    if(typeof r.mv==="number")D.mv=r.mv;
    if(typeof r.t==="number")D.temp=r.t;
    const v=(typeof r.ph==="number")?r.ph:phFrom(D,D.mv);
    if(v!=null){D.ph=v;samples.push(v);renderPH(D);const last=samples.slice(-5);
      if(last.length>=5&&Math.max(...last)-Math.min(...last)<0.02){stable=true;break;}}
    else renderPH(D);
    await sleep(600);
  }
  D.measuring=false;btn.disabled=false;btn.textContent="Meet";
  if(D.ph!=null) D.setStatus((stable?"Stabiel \u2713 pH ":"Niet stabiel: pH ")+D.ph.toFixed(2),stable?"on":"busy");
  else if(D.mv!=null) D.setStatus("Alleen mV (kalibratie niet gelezen)","err");
  else D.setStatus(lastErr!=null?"Meterfout e="+lastErr:"Geen antwoord van meter","err");
  renderPH(D);}
async function writePH(D){const t=D.card.querySelector(".tgt").value;
  const body=t==="stream"?{ph:D.ph,temp:D.temp,deviceName:"pH2Go",patch:false,stream:true}
    :{batchId:$("batch").value,ph:D.ph,temp:D.temp,field:"measuredMashPh",deviceName:"pH2Go",patch:true,stream:false};
  D.card.querySelector(".w").disabled=true;D.setStatus("Schrijven\u2026","busy");
  try{const r=await fetch("/api/write",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();const res=t==="stream"?d.results?.stream:d.results?.patch;const ok=!!res?.ok;
    D.log(`pH ${d.ph} \u2192 ${t==="stream"?"grafiek":"Mash pH"}: ${ok?"ok":"FOUT "+(res?.status||res?.error||"")}`);
    D.setStatus(ok?"Weggeschreven \u2713":"Mislukt","on");}
  catch(e){D.log("Netwerkfout");D.setStatus("Fout","err");}}

async function loadBatches(){const sel=$("batch");
  try{const r=await fetch("/api/batches");const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
    if(!d.batches.length){sel.innerHTML="<option value=''>Geen batches</option>";return;}
    sel.innerHTML=d.batches.map(b=>{const beer=(b.recipe&&b.recipe.trim())?b.recipe.trim():(b.name||"");
      const label=`Batch #${b.batchNo??"?"}${beer?" - "+beer:""}${b.status?" \u00b7 "+b.status:""}`;
      return `<option value="${b.id}">${label.replace(/"/g,"&quot;")}</option>`;}).join("");}
  catch(e){sel.innerHTML=`<option value=''>Batches laden mislukt (${e.message||e})</option>`;}}

$("batch").addEventListener("change",()=>devices.forEach(D=>D.type==="ed"?renderED(D):renderPH(D)));
$("connectEd").addEventListener("click",()=>connect("ed"));
$("connectPh").addEventListener("click",()=>connect("ph"));
if(!navigator.bluetooth){$("nobluetooth").style.display="block";$("connectEd").disabled=true;$("connectPh").disabled=true;setState("Geen Web Bluetooth","err");}
</script>
